<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muhammad Zain ul Abideen | Bano Qabil</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <main class="card">
    <div class="glow-ring" aria-hidden="true"></div>

    <div class="logo-wrap">
      <img
        src="assets/bano-qabil.svg"
        alt="Bano Qabil — Free IT Training Program"
        class="logo"
        width="220"
        height="220"
      />
    </div>

    <p class="program reveal">Bano Qabil Student</p>
    <h1 class="reveal name">
      <span id="name-text">Muhammad Zain ul Abideen</span>
    </h1>
    <p class="course reveal">
      <span class="course-label">Learning</span>
      <span class="course-highlight" id="course-text">Essentials of AI</span>
    </p>

    <div class="ai-dots reveal" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

    <footer class="credit reveal">
      <span class="credit-text">Made with</span>
      <span class="cursor-brand">Cursor AI</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
